<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>路线规划 · 前端预览</title>
<style>
  :root {
    --ink: #1c2733;
    --ink-70: rgba(28, 39, 51, 0.7);
    --ink-50: rgba(28, 39, 51, 0.5);
    --ink-38: rgba(28, 39, 51, 0.38);
    --ink-26: rgba(28, 39, 51, 0.26);
    --gold: #e3c766;
    --gold-deep: #8a6b2f;
    --green: #2f5a4a;
    --green-soft: #3c6b58;
    --line: rgba(28, 39, 51, 0.09);
    --card: rgba(255, 255, 255, 0.78);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 12% -6%, rgba(227, 199, 102, 0.16), transparent 62%),
      radial-gradient(1000px 700px at 92% 8%, rgba(122, 166, 205, 0.2), transparent 60%),
      linear-gradient(180deg, #eef4fa 0%, #e6eef7 52%, #dfe9f4 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    max-width: 1420px;
    margin: 0 auto;
    padding: 64px 48px 96px;
  }

  .stage-head {
    max-width: 760px;
    margin-bottom: 52px;
  }

  .eyebrow {
    margin: 0 0 16px;
    font-size: 11px;
    letter-spacing: 0.36em;
    color: var(--gold-deep);
  }

  .stage-head h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 46px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #16212c;
  }

  .lede {
    margin: 18px 0 0;
    max-width: 620px;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: var(--ink-70);
  }

  .lede b { font-weight: 600; color: var(--green); }
  .lede i { font-style: normal; color: var(--gold-deep); }

  .screens {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 44px 56px;
  }

  .screen { margin: 0; }

  .screen figcaption {
    margin-top: 26px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    color: var(--ink-50);
  }

  .screen figcaption span {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--gold-deep);
    letter-spacing: 0.1em;
  }

  /* ---------- 手机壳 ---------- */
  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    border-radius: 48px;
    overflow: hidden;
    background: linear-gradient(180deg, #fbfdff 0%, #f3f8fe 58%, #e9f1fb 100%);
    box-shadow:
      0 0 0 11px #10161d,
      0 0 0 12px #33404d,
      0 0 0 13px rgba(255, 255, 255, 0.06),
      0 48px 80px -34px rgba(16, 30, 46, 0.55),
      0 14px 30px -18px rgba(16, 30, 46, 0.4);
  }

  .phone::after {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 108px;
    height: 28px;
    transform: translateX(-50%);
    background: #10161d;
    border-radius: 0 0 18px 18px;
    z-index: 50;
  }

  .statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    padding: 16px 26px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    z-index: 40;
    pointer-events: none;
  }

  .statusbar .sys {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0.9;
  }

  .statusbar svg { display: block; }

  /* ---------- 页面骨架 ---------- */
  .page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 64px 22px 104px;
  }

  .brand {
    margin: 0 0 10px;
    font-size: 9.5px;
    letter-spacing: 0.34em;
    color: var(--gold-deep);
  }

  .page-title {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 27px;
    letter-spacing: 0.1em;
    color: var(--ink);
  }

  .page-sub {
    margin: 8px 0 0;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink-50);
  }

  .section-label {
    margin: 0;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--ink-38);
  }

  /* ---------- 屏幕一：输入 ---------- */
  .composer {
    margin-top: 30px;
    padding: 18px 18px 14px;
    border-radius: 26px;
    border: 1px solid var(--line);
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.66));
    box-shadow: 0 26px 44px -38px rgba(24, 46, 72, 0.55);
  }

  .composer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .composer-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-26);
  }

  .composer-text {
    margin: 14px 0 0;
    font-size: 14.5px;
    line-height: 1.85;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .caret {
    display: inline-block;
    width: 1.5px;
    height: 15px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--green);
    animation: blink 1.15s steps(1) infinite;
  }

  .composer-foot {
    margin-top: 16px;
    padding-top: 13px;
    border-top: 1px dashed rgba(28, 39, 51, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .composer-src {
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-38);
  }

  .composer-src b {
    font-weight: 600;
    color: var(--green);
  }

  .send {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 36px;
    padding: 0 18px;
    border: 0;
    border-radius: 100px;
    background: var(--green);
    color: #f7faff;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.1em;
    box-shadow: 0 12px 20px -14px rgba(47, 90, 74, 0.9);
  }

  .send svg { display: block; }

  .quick { margin-top: 26px; }

  .chips {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    padding: 8px 13px;
    border-radius: 100px;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-70);
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }

  .chip:hover {
    color: var(--green);
    border-color: rgba(47, 90, 74, 0.35);
  }

  .chip:first-child {
    color: var(--gold-deep);
    background: rgba(227, 199, 102, 0.1);
    border-color: rgba(227, 199, 102, 0.45);
  }

  .library { margin-top: 28px; }

  .library-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .library-more {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    color: var(--gold-deep);
  }

  .library-row {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
  }

  .lib-item {
    width: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
  }

  .lib-item:hover .pic {
    transform: scale(1.07);
  }

  .lib-item .pic {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.95);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 16px -10px rgba(24, 46, 72, 0.55);
  }

  .lib-item span {
    font-size: 9.5px;
    letter-spacing: 0.02em;
    color: var(--ink-50);
    white-space: nowrap;
  }

  /* ---------- 图片容器（加载失败回退衬线字） ---------- */
  .pic {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #e2ebf4 0%, #d3e0ed 55%, #c6d5e4 100%);
    flex: none;
  }

  .pic > span {
    font-family: var(--serif);
    color: rgba(47, 90, 74, 0.45);
  }

  .pic > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ---------- 屏幕二：资源包检测 ---------- */
  .mini-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 34px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.7);
    color: var(--ink-70);
    font-size: 17px;
    line-height: 1;
  }

  .mini-title {
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--ink-70);
  }

  .mini-step {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gold-deep);
  }

  .intent {
    margin-top: 18px;
    padding: 16px 17px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.64);
  }

  .intent-quote {
    margin: 0;
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.8;
    letter-spacing: 0.02em;
    color: #25313d;
  }

  .intent-quote::before { content: "“"; color: var(--gold); }
  .intent-quote::after { content: "”"; color: var(--gold); }

  .intent-top {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .intent-label {
    font-size: 9.5px;
    letter-spacing: 0.2em;
    color: var(--ink-38);
  }

  .intent-lock {
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--ink-38);
    background: rgba(28, 39, 51, 0.05);
    border: 1px solid rgba(28, 39, 51, 0.1);
  }

  .intent-tags {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .intent-tags span {
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--green);
    background: rgba(47, 90, 74, 0.07);
    border: 1px solid rgba(47, 90, 74, 0.14);
  }

  .stops-label {
    margin: 22px 0 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .stops-label em {
    font-style: normal;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-38);
  }

  .stop {
    position: relative;
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 9px;
    padding: 11px 12px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.74);
  }

  .stop-idx {
    flex: none;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-family: var(--serif);
    font-size: 10px;
    color: var(--gold-deep);
    border: 1px solid rgba(227, 199, 102, 0.65);
    background: rgba(227, 199, 102, 0.1);
  }

  .stop .pic {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    font-size: 16px;
  }

  .stop-body {
    flex: 1;
    min-width: 0;
  }

  .stop-name {
    margin: 0;
    font-family: var(--serif);
    font-size: 13.5px;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  .stop-meta {
    margin: 3px 0 0;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    color: var(--ink-38);
  }

  .state {
    flex: none;
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 9px;
    letter-spacing: 0.06em;
  }

  .state--ok {
    color: var(--green);
    background: rgba(47, 90, 74, 0.08);
    border: 1px solid rgba(47, 90, 74, 0.18);
  }

  .state--ok::before {
    content: "✓ ";
    color: var(--gold-deep);
  }

  .state--gen {
    color: var(--gold-deep);
    background: rgba(227, 199, 102, 0.16);
    border: 1px solid rgba(227, 199, 102, 0.55);
    animation: genPulse 1.9s ease-in-out infinite;
  }

  .state--queue {
    color: var(--ink-38);
    background: rgba(28, 39, 51, 0.05);
    border: 1px solid rgba(28, 39, 51, 0.1);
  }

  .stop.is-generating {
    border-color: rgba(227, 199, 102, 0.5);
    background: rgba(255, 253, 245, 0.9);
  }

  .stop-bar {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 5px;
    height: 2px;
    border-radius: 10px;
    background: rgba(227, 199, 102, 0.22);
    overflow: hidden;
  }

  .stop-bar i {
    display: block;
    height: 100%;
    width: 62%;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(200, 160, 63, 0.55), #c8a03f);
    animation: barBreath 2.4s ease-in-out infinite;
  }

  .gen-card {
    margin-top: 16px;
    padding: 14px 16px 15px;
    border-radius: 18px;
    background: linear-gradient(150deg, #2f5a4a 0%, #38664f 60%, #2c5545 100%);
    color: #f4f8fb;
    box-shadow: 0 18px 30px -24px rgba(28, 64, 50, 0.9);
  }

  .gen-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  .gen-top span:last-child {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: rgba(244, 248, 251, 0.55);
  }

  .gen-bar {
    margin-top: 11px;
    height: 3px;
    border-radius: 10px;
    background: rgba(244, 248, 251, 0.18);
    overflow: hidden;
  }

  .gen-bar i {
    display: block;
    height: 100%;
    width: 68%;
    border-radius: 10px;
    background: linear-gradient(90deg, rgba(227, 199, 102, 0.6), var(--gold));
  }

  .gen-note {
    margin: 10px 0 0;
    font-size: 9.5px;
    letter-spacing: 0.04em;
    color: rgba(244, 248, 251, 0.6);
  }

  .gen-note b { color: var(--gold); font-weight: 500; }

  /* ---------- 屏幕三：地图 ---------- */
  .page--map { padding: 0; }

  .map {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #f6f3ea;
  }

  .map-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .water-label {
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 0.32em;
    fill: #8fb3c1;
  }

  .zone-label {
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 0.34em;
    fill: #a7a99f;
  }

  .route-line {
    stroke-dasharray: 2 9;
    animation: dash 26s linear infinite;
  }

  .map-top {
    position: absolute;
    top: 56px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .map-card {
    flex: 1;
    padding: 13px 16px 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 18px 34px -26px rgba(30, 52, 78, 0.55);
    backdrop-filter: blur(14px);
  }

  .map-kicker {
    margin: 0;
    font-size: 8.5px;
    letter-spacing: 0.26em;
    color: var(--gold-deep);
  }

  .map-card h3 {
    margin: 7px 0 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 17px;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  .map-meta {
    margin: 6px 0 0;
    font-size: 9.5px;
    letter-spacing: 0.05em;
    color: var(--ink-50);
  }

  .map-ready {
    margin: 9px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--green);
  }

  .map-ready i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #5f9a78;
    box-shadow: 0 0 7px rgba(95, 154, 120, 0.9);
  }

  .map-round {
    flex: none;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 14px 24px -18px rgba(30, 52, 78, 0.6);
    color: var(--green);
  }

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    z-index: 6;
    cursor: pointer;
  }

  .node:hover .node-label {
    color: var(--green);
    border-color: rgba(47, 90, 74, 0.35);
  }

  .node-pic {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2.5px solid #ffffff;
    box-shadow:
      0 0 0 1.5px rgba(200, 160, 63, 0.9),
      0 12px 22px -10px rgba(28, 39, 51, 0.6);
    animation: nodeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .node-pic .pic {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font-size: 18px;
  }

  .node-badge {
    position: absolute;
    top: -3px;
    right: -4px;
    width: 19px;
    height: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 9.5px;
    font-weight: 600;
    color: #f8fbfe;
    background: var(--green);
    border: 1.5px solid #fdfefe;
    box-shadow: 0 4px 10px -4px rgba(20, 40, 30, 0.7);
  }

  .node-label {
    padding: 4px 9px;
    border-radius: 100px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #26332d;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(28, 39, 51, 0.07);
    box-shadow: 0 8px 14px -12px rgba(28, 39, 51, 0.8);
    white-space: nowrap;
  }

  .node:nth-of-type(2) .node-pic { animation-delay: 0.12s; }
  .node:nth-of-type(3) .node-pic { animation-delay: 0.24s; }
  .node:nth-of-type(4) .node-pic { animation-delay: 0.36s; }

  .map-controls {
    position: absolute;
    right: 16px;
    bottom: 306px;
    z-index: 8;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .map-ctrl {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid rgba(28, 39, 51, 0.08);
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 10px 18px -14px rgba(28, 39, 51, 0.7);
    color: var(--ink-70);
    font-size: 15px;
    line-height: 1;
  }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 88px;
    z-index: 20;
    padding: 10px 20px 18px;
    border-radius: 30px 30px 0 0;
    background: rgba(255, 255, 255, 0.95);
    border-top: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 -18px 40px -30px rgba(24, 46, 72, 0.6);
    backdrop-filter: blur(18px);
  }

  .sheet-grab {
    width: 34px;
    height: 3px;
    margin: 0 auto 12px;
    border-radius: 10px;
    background: rgba(28, 39, 51, 0.14);
  }

  .sheet-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .sheet-head b {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--ink);
  }

  .sheet-link {
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--gold-deep);
    border-bottom: 1px solid rgba(138, 107, 47, 0.3);
    padding-bottom: 1px;
  }

  .sheet-row {
    margin-top: 13px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .sheet-item {

<script>
(function () {
  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

  var toastEl;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.id = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  // 「试试这样说」→ 覆盖输入框
  $$('.chip[data-fill]').forEach(function (c) {
    c.addEventListener('click', function () {
      $('#composerValue').textContent = c.getAttribute('data-fill');
      toast('已填入示例，可直接生成路线');
    });
  });

  // 景点圆图 → 跳转资源包
  function bindOpen(selector) {
    $$(selector).forEach(function (el) {
      el.addEventListener('click', function () {
        toast('进入《' + el.getAttribute('data-name') + '》资源包');
      });
    });
  }
  bindOpen('.lib-item[data-name]');
  bindOpen('.node[data-name]');
  bindOpen('.sheet-item[data-name]');

  // 沿路线连续游览
  var stops = [
    ['白马寺', '8 幕 · 武则天讲述'],
    ['洛阳博物馆', '5 幕 · 河洛文明'],
    ['洛邑古城', '6 幕 · 夜色灯影'],
    ['龙门石窟', '8 幕 · 卢舍那大佛']
  ];
  var ov = $('#tourOv');
  var idx = 0;
  function render() {
    $('#tourTitle').textContent = '第 ' + (idx + 1) + ' 站 · ' + stops[idx][0];
    $('#tourSub').textContent = stops[idx][1] + ' · 看完自动衔接下一站';
    $$('#tourDots i').forEach(function (d, i) { d.classList.toggle('on', i <= idx); });
    $('#tourNext').textContent = idx === stops.length - 1 ? '看完最后一站 · 重新游览' : '看完，进入下一站';
  }
  $('#startTour').addEventListener('click', function () {
    idx = 0;
    render();
    ov.hidden = false;
  });
  $('#tourNext').addEventListener('click', function () {
    idx = (idx + 1) % stops.length;
    render();
  });
  $('#tourExit').addEventListener('click', function () { ov.hidden = true; });
})();
</script>
